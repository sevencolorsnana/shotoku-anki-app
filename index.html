<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>所得税法 理論暗記</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<style>
  :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation; }
  button, label, a { touch-action: manipulation; }
  .blink { animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  .hole { color: #4f46e5; font-weight: 700; background: rgba(99,102,241,.1); border-radius: 4px; padding: 0 2px; }
  .dark .hole { color: #a5b4fc; background: rgba(99,102,241,.2); }
  .hole-wrong { color: #dc2626; font-weight: 700; background: rgba(239,68,68,.12); border-radius: 4px; padding: 0 2px; }
  .dark .hole-wrong { color: #fca5a5; background: rgba(239,68,68,.22); }
  .mask { color: #94a3b8; padding: 0 2px; }
  .mask-wrong { color: #ef4444; font-weight: 700; padding: 0 2px; }
  .answer-reveal { color: #059669; font-weight: 700; }
  .dark .answer-reveal { color: #34d399; }
  .confetti-piece { position: fixed; width: 9px; height: 14px; top: -20px; z-index: 90; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
  .card-in { animation: cardIn .28s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes cardIn { from { opacity: 0; transform: translateX(28px) scale(.98); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .3s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  .pressable { transition: transform .08s, filter .15s; }
  .pressable:active { transform: scale(.96); filter: brightness(.92); }
  #qScroll::-webkit-scrollbar { width: 4px; }
  #qScroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 4px; }
</style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
<div class="mx-auto max-w-[520px] min-h-[100dvh] flex flex-col">

  <!-- 固定ヘッダー -->
  <header class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[520px] z-40
                 bg-gradient-to-r from-indigo-600 via-violet-600 to-fuchsia-600 text-white shadow-lg">
    <div class="px-4 pt-2.5 pb-2 flex items-center justify-between">
      <div class="leading-tight">
        <div class="text-[11px] opacity-80">所得税法 理論暗記 <span id="appVer" class="opacity-60"></span></div>
        <div class="text-sm font-bold">試験まで <span id="daysLeft">--</span>日
          <span class="ml-2 text-[11px] font-normal opacity-90">🔥<span id="streak">0</span>連続</span>
        </div>
      </div>
      <nav class="flex gap-1 text-[13px]">
        <button data-tab="quiz" class="tabbtn px-2.5 py-1.5 rounded-lg pressable">出題</button>
        <button data-tab="stats" class="tabbtn px-2.5 py-1.5 rounded-lg pressable">分析</button>
        <button data-tab="range" class="tabbtn px-2.5 py-1.5 rounded-lg pressable">範囲</button>
        <button data-tab="settings" class="tabbtn px-2.5 py-1.5 rounded-lg pressable">⚙</button>
      </nav>
    </div>
    <div class="h-1.5 bg-black/20">
      <div id="progressBar" class="h-full bg-gradient-to-r from-amber-300 to-emerald-300 transition-all duration-300" style="width:0%"></div>
    </div>
  </header>
  <div class="h-[62px]"></div>

  <!-- 出題タブ -->
  <main id="view-quiz" class="flex-1 px-3 pb-[150px] pt-2 flex flex-col">
    <div id="loadingBox" class="flex-1 flex flex-col items-center justify-center gap-3 text-slate-500 min-h-[50vh]">
      <div class="animate-spin w-10 h-10 border-4 border-indigo-400 border-t-transparent rounded-full"></div>
      <div id="loadingMsg" class="text-sm">読み込み中...</div>
      <button id="loadBtn" onclick="loadCards(true)" class="hidden px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-bold pressable">データを読み込む</button>
    </div>

    <div id="quizBox" class="hidden flex-1 flex-col">
      <div id="qCard" class="bg-white dark:bg-slate-900 rounded-2xl shadow-lg ring-1 ring-slate-200 dark:ring-slate-800 p-4 flex-1 flex flex-col">
        <div class="flex items-center gap-1.5 flex-wrap mb-1.5">
          <span id="qSection" class="text-[11px] font-bold bg-indigo-600 text-white px-2 py-0.5 rounded-full"></span>
          <span id="qRank" class="text-[11px] text-amber-500 font-bold"></span>
          <span id="qHole" class="text-[11px] text-slate-400"></span>
          <span id="wrongBadge" class="hidden text-[11px] font-bold bg-rose-500 text-white px-2 py-0.5 rounded-full pop">前回不正解</span>
          <button onclick="openEdit()" class="ml-auto text-[11px] px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500 pressable">✏️ 修正</button>
        </div>
        <div id="qTitle" class="text-sm font-bold mb-0.5"></div>
        <div id="qHeading" class="text-[11px] text-slate-400 mb-2"></div>
        <div id="qScroll" class="overflow-y-auto max-h-[calc(100dvh-330px)]">
          <div id="qText" class="text-[15px] leading-[1.9] whitespace-pre-wrap"></div>
        </div>
      </div>
    </div>

    <div id="doneBox" class="hidden flex-1 flex-col items-center justify-center gap-4 text-center min-h-[50vh]">
      <div class="text-6xl pop">🎉</div>
      <div class="text-xl font-bold">今日の分は完了！</div>
      <div id="doneStats" class="text-sm text-slate-500"></div>
      <button id="reviewWrongBtn" onclick="startWrongReview()" class="hidden px-6 py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl font-bold shadow-lg pressable">😤 不正解だけ即時復習</button>
      <button onclick="loadCards(true)" class="px-6 py-3 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg pressable">🔄 再取得</button>
    </div>
  </main>

  <!-- 分析タブ -->
  <main id="view-stats" class="hidden flex-1 px-3 pb-28 pt-2 space-y-3"></main>

  <!-- 範囲タブ -->
  <main id="view-range" class="hidden flex-1 px-3 pb-28 pt-2">
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow p-4">
      <h2 class="font-bold mb-3">出題範囲</h2>
      <div class="flex gap-2 mb-3 flex-wrap">
        <button onclick="rangeAll(true)" class="px-3 py-1.5 text-xs bg-slate-200 dark:bg-slate-700 rounded-lg pressable">全選択</button>
        <button onclick="rangeAll(false)" class="px-3 py-1.5 text-xs bg-slate-200 dark:bg-slate-700 rounded-lg pressable">全解除</button>
        <button onclick="savePreset()" class="px-3 py-1.5 text-xs bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-300 rounded-lg pressable">＋プリセット保存</button>
      </div>
      <div id="presetList" class="flex gap-2 mb-3 flex-wrap"></div>
      <div id="rangeList" class="text-sm max-h-[55vh] overflow-y-auto"></div>
      <button onclick="applyRange()" class="mt-4 w-full py-3 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-xl font-bold shadow pressable">この範囲で出題</button>
    </div>
  </main>

  <!-- 設定タブ -->
  <main id="view-settings" class="hidden flex-1 px-3 pb-28 pt-2">
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow p-4 space-y-4 text-sm">
      <h2 class="font-bold">設定</h2>
      <label class="block">Notionトークン
        <input id="setToken" type="password" class="mt-1 w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
      </label>
      <label class="block">プロキシURL
        <input id="setProxy" type="text" class="mt-1 w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
      </label>
      <label class="block">データベースID
        <input id="setDb" type="text" class="mt-1 w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
      </label>
      <label class="flex items-center justify-between gap-3">高正答率の穴をスキップ<span class="text-[11px] text-slate-400">(90%以上・3回以上)</span>
        <input id="setSkip" type="checkbox" class="w-5 h-5 accent-indigo-600">
      </label>
      <label class="flex items-center justify-between">終了後に不正解を即時復習
        <input id="setRetry" type="checkbox" class="w-5 h-5 accent-indigo-600" checked>
      </label>
      <label class="flex items-center justify-between">ダークモード
        <input id="setDark" type="checkbox" class="w-5 h-5 accent-indigo-600">
      </label>
      <button onclick="saveSettings()" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold pressable">保存</button>
      <div id="saveMsg" class="text-center text-emerald-600 text-xs h-4"></div>
      <button onclick="clearCache()" class="w-full py-2 text-xs text-rose-500 underline">キャッシュを削除して全件再取得</button>
    </div>
  </main>

  <!-- 固定フッター（採点ボタン） -->
  <footer id="footerBar" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[520px] z-40
                 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-t border-slate-200 dark:border-slate-800
                 px-3 pt-2.5" style="padding-bottom: calc(10px + var(--safe-bottom));">
    <div class="flex items-center justify-between mb-1.5">
      <div class="flex gap-1.5">
        <button id="undoBtn" onclick="undo()" class="text-[11px] px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 pressable" disabled>↩ 戻る</button>
        <button onclick="skipHeading()" class="text-[11px] px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 pressable">⏩ 見出し</button>
      </div>
      <span class="text-[11px] text-slate-400">進捗 <span id="progressText">0/0</span></span>
      <button onclick="skipSection()" class="text-[11px] px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 pressable">⏭ 次の題</button>
    </div>
    <button id="revealBtn" onclick="reveal()" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-2xl font-bold text-base shadow-lg pressable">👀 正解を確認する</button>
    <div id="judgeBtns" class="hidden grid grid-cols-2 gap-3">
      <button onclick="judge(false)" class="py-3.5 bg-gradient-to-r from-rose-500 to-red-500 text-white rounded-2xl font-bold text-base shadow-lg pressable">✗ 不正解</button>
      <button onclick="judge(true)" class="py-3.5 bg-gradient-to-r from-emerald-500 to-green-500 text-white rounded-2xl font-bold text-base shadow-lg pressable">✓ 正解</button>
    </div>
  </footer>

  <!-- 修正モーダル -->
  <div id="editModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center" onclick="if(event.target===this)closeEdit()">
    <div class="bg-white dark:bg-slate-900 w-full max-w-[520px] rounded-t-3xl sm:rounded-2xl p-4 max-h-[85dvh] overflow-y-auto">
      <h3 class="font-bold mb-3">✏️ 問題を修正 <span id="editId" class="text-xs text-slate-400"></span></h3>
      <label class="block text-xs text-slate-500 mb-2">問題文（〔_〕=出題穴、〔●n〕=他の穴）
        <textarea id="editQ" rows="8" class="mt-1 w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm leading-relaxed"></textarea>
      </label>
      <label class="block text-xs text-slate-500 mb-3">正解
        <textarea id="editA" rows="2" class="mt-1 w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm"></textarea>
      </label>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="closeEdit()" class="py-3 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold pressable">キャンセル</button>
        <button onclick="saveEdit()" id="editSaveBtn" class="py-3 bg-indigo-600 text-white rounded-xl font-bold pressable">保存</button>
      </div>
      <div id="editMsg" class="text-center text-xs mt-2 h-4"></div>
    </div>
  </div>

  <div id="toast" class="hidden fixed top-[70px] left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-sm font-bold text-white shadow-lg pop"></div>
</div>

<script>
'use strict';
const APP_VER = 'v16';  // 更新のたびに上げる（キャッシュ確認用）
const EXAM_DATE = new Date('2026-08-04T00:00:00');
const DEFAULTS = {
  proxy: 'https://notion-proxy.djsa9pro.workers.dev',
  db: '36ffa2ca-2310-8184-85f0-c579a9cefb48',
  token: '', skip: false, retry: true, dark: false,
};
const $ = id => document.getElementById(id);

// ── 設定 ──
let cfg = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('cfg') || '{}'));
function applyDark() { document.documentElement.classList.toggle('dark', cfg.dark); }
applyDark();
function saveSettings() {
  cfg.token = $('setToken').value.trim();
  cfg.proxy = $('setProxy').value.trim().replace(/\/$/, '');
  cfg.db = $('setDb').value.trim();
  cfg.skip = $('setSkip').checked;
  cfg.retry = $('setRetry').checked;
  cfg.dark = $('setDark').checked;
  localStorage.setItem('cfg', JSON.stringify(cfg));
  applyDark();
  $('saveMsg').textContent = '✓ 保存しました';
  setTimeout(() => $('saveMsg').textContent = '', 2000);
}
function fillSettings() {
  $('setToken').value = cfg.token; $('setProxy').value = cfg.proxy; $('setDb').value = cfg.db;
  $('setSkip').checked = cfg.skip; $('setRetry').checked = cfg.retry; $('setDark').checked = cfg.dark;
}

// ── トースト ──
function toast(msg, color = 'bg-slate-700') {
  const t = $('toast');
  t.textContent = msg;
  t.className = `fixed top-[70px] left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-sm font-bold text-white shadow-lg pop ${color}`;
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.add('hidden'), 2200);
}

// ── タブ ──
function showTab(name) {
  if (typeof removeAnsPop === 'function' && name !== 'quiz') removeAnsPop();
  for (const t of ['quiz', 'stats', 'range', 'settings']) {
    $('view-' + t).classList.toggle('hidden', t !== name);
  }
  document.querySelectorAll('.tabbtn').forEach(b => {
    const on = b.dataset.tab === name;
    b.className = 'tabbtn px-2.5 py-1.5 rounded-lg pressable ' + (on ? 'bg-white/25 font-bold' : 'opacity-75');
  });
  $('footerBar').classList.toggle('hidden', name !== 'quiz');
  if (name === 'stats') renderStats();
  if (name === 'range') renderRange();
  if (name === 'settings') fillSettings();
}
document.querySelectorAll('.tabbtn').forEach(b => b.onclick = () => showTab(b.dataset.tab));

function daysToExam() { return Math.max(0, Math.ceil((EXAM_DATE - new Date()) / 86400000)); }
$('daysLeft').textContent = daysToExam();
$('appVer').textContent = APP_VER;

// ── Notion API ──
async function notion(path, payload, method = 'POST') {
  const res = await fetch(cfg.proxy + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.token, 'Notion-Version': '2022-06-28' },
    body: payload ? JSON.stringify(payload) : undefined,
  });
  if (!res.ok) throw new Error('API ' + res.status + ': ' + (await res.text()).slice(0, 150));
  return res.json();
}
function prop(p, name, type) {
  const v = p[name];
  if (!v) return type === 'number' ? 0 : '';
  if (type === 'title') return (v.title || []).map(x => x.plain_text).join('');
  if (type === 'rich_text') return (v.rich_text || []).map(x => x.plain_text).join('');
  if (type === 'number') return v.number ?? 0;
  if (type === 'select') return v.select ? v.select.name : '';
  return '';
}

// ── 状態 ──
let cards = [];
let queueIdx = 0;
let sessionResults = {};
let wrongCards = [];
let wrongMap = JSON.parse(localStorage.getItem('wrongMap') || '{}');
let history = JSON.parse(localStorage.getItem('history') || '{}'); // section -> {ok, ng, title}
let streak = 0;
let inWrongReview = false;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function selectedSections() { return JSON.parse(localStorage.getItem('rangeSel') || 'null'); }

// ── セッションキャッシュ（リロードしても再取得しない） ──
function saveState() {
  try {
    localStorage.setItem('quizState', JSON.stringify({
      date: todayStr(), range: localStorage.getItem('rangeSel') || 'null',
      cards, queueIdx, sessionResults,
      wrongIds: wrongCards.map(c => c.id), inWrongReview, streak,
    }));
  } catch (e) { /* 容量超過時は諦める */ }
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('quizState') || 'null');
    if (!s || s.date !== todayStr()) return false;
    if (s.range !== (localStorage.getItem('rangeSel') || 'null')) return false;
    cards = s.cards; queueIdx = s.queueIdx; sessionResults = s.sessionResults || {};
    wrongCards = cards.filter(c => (s.wrongIds || []).includes(c.id));
    inWrongReview = s.inWrongReview; streak = s.streak || 0;
    return cards.length > 0;
  } catch (e) { return false; }
}
function clearCache() {
  localStorage.removeItem('quizState');
  toast('キャッシュを削除しました', 'bg-rose-500');
  showTab('quiz');
  loadCards(true);
}

// ── データ取得 ──
async function loadCards(force) {
  if (!force && loadState()) {
    // キャッシュから復元
    $('loadingBox').classList.add('hidden');
    $('streak').textContent = streak;
    if (queueIdx >= cards.length) showDone();
    else { $('quizBox').classList.remove('hidden'); $('quizBox').classList.add('flex'); renderCard(); }
    toast('前回の続きから再開', 'bg-indigo-500');
    return;
  }
  inWrongReview = false;
  $('loadingBox').classList.remove('hidden');
  $('quizBox').classList.add('hidden'); $('quizBox').classList.remove('flex');
  $('doneBox').classList.add('hidden'); $('doneBox').classList.remove('flex');
  $('loadBtn').classList.add('hidden');
  const msg = $('loadingMsg');
  if (!cfg.token) {
    msg.textContent = '⚙設定タブでNotionトークンを入力してください';
    $('loadBtn').classList.remove('hidden');
    return;
  }
  try {
    let results = [], cursor, page = 0;
    do {
      const body = {
        page_size: 100,
        filter: { property: '次回出題日', date: { on_or_before: todayStr() } },
        sorts: [{ property: '穴ID', direction: 'ascending' }],
      };
      if (cursor) body.start_cursor = cursor;
      const j = await notion(`/v1/databases/${cfg.db}/query`, body);
      results = results.concat(j.results);
      cursor = j.has_more ? j.next_cursor : undefined;
      msg.textContent = `出題対象を取得中... ${results.length}件`;
    } while (cursor && ++page < 80);

    let all = results.map(r => ({
      pageId: r.id,
      id: prop(r.properties, '穴ID', 'title'),
      section: prop(r.properties, '題番号', 'rich_text'),
      title: prop(r.properties, '題名', 'rich_text'),
      heading: prop(r.properties, '大見出し', 'rich_text'),
      question: prop(r.properties, '問題文', 'rich_text'),
      answer: prop(r.properties, '正解', 'rich_text'),
      holeNum: prop(r.properties, '穴番号', 'number'),
      rank: prop(r.properties, '重要度', 'select'),
      interval: prop(r.properties, '間隔_日数', 'number') || 1,
      ef: prop(r.properties, '難易度係数', 'number') || 2.5,
      correct: prop(r.properties, '正答回数', 'number'),
      total: prop(r.properties, '出題回数', 'number'),
    }));
    const sel = selectedSections();
    if (sel) all = all.filter(c => sel.includes(c.section));
    if (cfg.skip) all = all.filter(c => !(c.total >= 3 && c.correct / c.total >= 0.9));

    const bySec = {};
    for (const c of all) (bySec[c.section] = bySec[c.section] || []).push(c);
    const secs = Object.keys(bySec);
    for (let i = secs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [secs[i], secs[j]] = [secs[j], secs[i]];
    }
    cards = [];
    for (const s of secs) {
      bySec[s].sort((a, b) => a.holeNum - b.holeNum);
      cards = cards.concat(bySec[s]);
    }
    queueIdx = 0; wrongCards = []; sessionResults = {}; streak = 0;
    undoStack = []; updateUndoBtn();
    saveState();
    $('loadingBox').classList.add('hidden');
    if (cards.length === 0) showDone();
    else { $('quizBox').classList.remove('hidden'); $('quizBox').classList.add('flex'); renderCard(); }
  } catch (e) {
    msg.textContent = '⚠ ' + e.message;
    $('loadBtn').classList.remove('hidden');
  }
}

// ── 出題 ──
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function renderCard() {
  removeAnsPop();
  const c = cards[queueIdx];
  if (!c) { showDone(); return; }
  $('qSection').textContent = '問題' + c.section;
  $('qRank').textContent = c.rank || '';
  $('qTitle').textContent = c.title;
  $('qHole').textContent = `#穴${c.holeNum}・${c.total > 0 ? Math.round(c.correct / c.total * 100) + '%' : '初'}`;
  $('qHeading').textContent = c.heading;
  $('wrongBadge').classList.toggle('hidden', !wrongMap[c.id]);

  // 出題穴と伏せ字を同じ3文字幅に統一（問題が進んでも本文がズレない）
  const curCls = wrongMap[c.id] ? 'hole-wrong' : 'hole';
  $('qText').innerHTML = esc(c.question)
    .replace(/〔_〕/g, `<span class="${curCls} blink">〔？〕</span>`)
    .replace(/〔●(\d+)〕/g, (m, n) => {
      const oid = c.section + '_' + String(n).padStart(3, '0');
      return `<span class="${wrongMap[oid] ? 'mask-wrong' : 'mask'}">〔●〕</span>`;
    });
  $('qCard').classList.remove('card-in');
  void $('qCard').offsetWidth;
  $('qCard').classList.add('card-in');
  $('qScroll').scrollTop = 0;
  // 〔？〕が見える位置までスクロール
  setTimeout(() => {
    const el = $('qText').querySelector('.blink');
    if (el) el.scrollIntoView({ block: 'center', behavior: 'instant' });
  }, 50);
  $('revealBtn').classList.remove('hidden');
  $('judgeBtns').classList.add('hidden');
  updateProgress();
}

function updateProgress() {
  const done = Math.min(queueIdx, cards.length);
  $('progressText').textContent = `${done} / ${cards.length}` + (inWrongReview ? '（復習中）' : '');
  $('progressBar').style.width = (cards.length ? done / cards.length * 100 : 0) + '%';
  $('streak').textContent = streak;
}

function removeAnsPop() {
  const p = $('ansPop');
  if (p) p.remove();
  if (removeAnsPop._cleanup) { removeAnsPop._cleanup(); removeAnsPop._cleanup = null; }
}

function reveal() {
  const c = cards[queueIdx];
  if (!c) return;
  const el = $('qText').querySelector('.blink') || $('qText').querySelector('.hole, .hole-wrong');
  if (el) {
    el.classList.remove('blink');
    removeAnsPop();
    // body直下に固定配置（スクロール領域にクリップされず、必ず画面内に収まる）
    const pop = document.createElement('div');
    pop.id = 'ansPop';
    pop.className = 'pop';
    pop.textContent = c.answer;
    pop.style.cssText =
      'position:fixed;z-index:60;background:#059669;color:#fff;font-weight:700;' +
      'font-size:16px;line-height:1.5;padding:8px 12px;border-radius:12px;' +
      'box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:calc(100vw - 24px);' +
      'width:max-content;white-space:normal;visibility:hidden;';
    const tail = document.createElement('div');
    tail.id = 'ansPopTail';
    tail.style.cssText = 'position:absolute;border:7px solid transparent;';
    pop.appendChild(tail);
    document.body.appendChild(pop);

    const place = () => {
      const r = el.getBoundingClientRect();
      const vw = document.documentElement.clientWidth;
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      // 横: 穴の左端に合わせ、画面内にクランプ
      let left = Math.min(Math.max(r.left, 12), vw - pw - 12);
      // 縦: 穴の上。入らなければ下。
      const headerH = 70;
      let top = r.top - ph - 10;
      let below = false;
      if (top < headerH) { top = r.bottom + 10; below = true; }
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
      // しっぽを穴の中央に向ける
      const tx = Math.min(Math.max(r.left + r.width / 2 - left - 7, 8), pw - 22);
      tail.style.left = tx + 'px';
      if (below) {
        tail.style.top = '-14px'; tail.style.bottom = '';
        tail.style.borderBottomColor = pop.style.background || '#059669';
        tail.style.borderTopColor = 'transparent';
      } else {
        tail.style.bottom = '-14px'; tail.style.top = '';
        tail.style.borderTopColor = pop.style.background || '#059669';
        tail.style.borderBottomColor = 'transparent';
      }
      pop.style.visibility = 'visible';
    };
    requestAnimationFrame(place);
    el.scrollIntoView({ block: 'center', behavior: 'instant' });
    requestAnimationFrame(place);
    // スクロールに追従
    const sc = $('qScroll');
    sc.addEventListener('scroll', place, { passive: true });
    removeAnsPop._cleanup = () => sc.removeEventListener('scroll', place);
  }
  $('revealBtn').classList.add('hidden');
  $('judgeBtns').classList.remove('hidden');
}

// ── SM-2 ──
function intervalCap() {
  const d = daysToExam();
  if (d <= 7) return 1;
  if (d <= 14) return 3;
  if (d <= 30) return 7;
  return 60;
}
function sm2(c, ok) {
  let interval = c.interval, ef = c.ef;
  if (ok) {
    ef = Math.min(3.0, ef + 0.1);
    interval = (c.total === 0 || interval <= 1) ? (c.total === 0 ? 1 : 3) : Math.round(interval * ef);
  } else {
    ef = Math.max(1.3, ef - 0.2);
    interval = 1;
  }
  interval = Math.max(1, Math.min(interval, intervalCap(), daysToExam() || 1));
  const next = new Date();
  next.setDate(next.getDate() + interval);
  const nextStr = next.getFullYear() + '-' + String(next.getMonth() + 1).padStart(2, '0') + '-' + String(next.getDate()).padStart(2, '0');
  return { interval, ef, nextStr };
}

// ── アンドゥ ──
let undoStack = [];
function updateUndoBtn() {
  const b = $('undoBtn');
  b.disabled = undoStack.length === 0;
  b.classList.toggle('opacity-40', undoStack.length === 0);
}
function undo() {
  const u = undoStack.pop();
  if (!u) return;
  const c = cards[u.idx];
  // ローカル統計の巻き戻し
  const st = sessionResults[c.section];
  if (st) { u.ok ? st.ok-- : st.ng--; }
  if (!u.inWrongReview) {
    const h = history[c.section];
    if (h) { u.ok ? h.ok-- : h.ng--; localStorage.setItem('history', JSON.stringify(history)); }
  }
  if (u.wasWrong) wrongMap[c.id] = true; else delete wrongMap[c.id];
  localStorage.setItem('wrongMap', JSON.stringify(wrongMap));
  if (!u.ok) {
    const wi = wrongCards.lastIndexOf(c);
    if (wi >= 0) wrongCards.splice(wi, 1);
  }
  streak = u.streak;
  // SM-2とNotionの巻き戻し
  if (!u.inWrongReview) {
    c.correct = u.prev.correct; c.total = u.prev.total;
    c.interval = u.prev.interval; c.ef = u.prev.ef;
    notion('/v1/pages/' + c.pageId, {
      properties: {
        '次回出題日': { date: { start: todayStr() } },
        '間隔_日数': { number: c.interval },
        '難易度係数': { number: c.ef },
        '正答回数': { number: c.correct },
        '出題回数': { number: c.total },
      },
    }, 'PATCH').catch(() => toast('巻き戻しの書き込み失敗', 'bg-rose-500'));
  }
  queueIdx = u.idx;
  saveState();
  updateUndoBtn();
  $('quizBox').classList.remove('hidden'); $('quizBox').classList.add('flex');
  $('doneBox').classList.add('hidden'); $('doneBox').classList.remove('flex');
  renderCard();
  toast('↩ 1問戻しました', 'bg-indigo-500');
}

function judge(ok) {
  const c = cards[queueIdx];
  if (!c) return;
  undoStack.push({
    idx: queueIdx, ok, inWrongReview,
    wasWrong: !!wrongMap[c.id], streak,
    prev: { correct: c.correct, total: c.total, interval: c.interval, ef: c.ef },
  });
  if (undoStack.length > 20) undoStack.shift();
  updateUndoBtn();
  const r = sm2(c, ok);
  const st = sessionResults[c.section] = sessionResults[c.section] || { ok: 0, ng: 0, title: c.title };
  ok ? st.ok++ : st.ng++;
  // 累計履歴（分析用）
  const h = history[c.section] = history[c.section] || { ok: 0, ng: 0, title: c.title };
  if (!inWrongReview) { ok ? h.ok++ : h.ng++; h.title = c.title; localStorage.setItem('history', JSON.stringify(history)); }

  if (ok) { delete wrongMap[c.id]; streak++; }
  else { wrongMap[c.id] = true; wrongCards.push(c); streak = 0; }
  localStorage.setItem('wrongMap', JSON.stringify(wrongMap));

  if (!inWrongReview) {
    notion('/v1/pages/' + c.pageId, {
      properties: {
        '次回出題日': { date: { start: r.nextStr } },
        '間隔_日数': { number: r.interval },
        '難易度係数': { number: r.ef },
        '正答回数': { number: c.correct + (ok ? 1 : 0) },
        '出題回数': { number: c.total + 1 },
      },
    }, 'PATCH').catch(() => toast('書き戻し失敗（後で再同期されません）', 'bg-rose-500'));
    c.correct += ok ? 1 : 0; c.total += 1; c.interval = r.interval; c.ef = r.ef;
  }

  if (ok) { confetti(); }
  else {
    // 穴と吹き出しを赤に切り替えて目立たせる
    const span = $('qText').querySelector('.hole, .hole-wrong');
    if (span) span.classList.replace('hole', 'hole-wrong');
    const pop = $('ansPop');
    if (pop) {
      pop.style.background = '#dc2626';
      const tail = $('ansPopTail');
      if (tail) {
        if (tail.style.borderTopColor !== 'transparent' && tail.style.borderTopColor) tail.style.borderTopColor = '#dc2626';
        if (tail.style.borderBottomColor !== 'transparent' && tail.style.borderBottomColor) tail.style.borderBottomColor = '#dc2626';
      }
    }
  }
  queueIdx++;
  saveState();
  setTimeout(renderCard, ok ? 300 : 800);
}

// ── スキップ ──
function skipHeading() {
  const c = cards[queueIdx];
  if (!c) return;
  let n = 0;
  while (queueIdx < cards.length &&
         cards[queueIdx].section === c.section &&
         cards[queueIdx].heading === c.heading) { queueIdx++; n++; }
  toast(`⏩ ${c.heading || '見出し'} を${n}問スキップ`, 'bg-slate-600');
  saveState();
  renderCard();
}
function skipSection() {
  const c = cards[queueIdx];
  if (!c) return;
  let n = 0;
  while (queueIdx < cards.length && cards[queueIdx].section === c.section) { queueIdx++; n++; }
  toast(`⏭ 問題${c.section} を${n}問スキップ`, 'bg-slate-600');
  saveState();
  renderCard();
}

function showDone() {
  $('quizBox').classList.add('hidden'); $('quizBox').classList.remove('flex');
  $('loadingBox').classList.add('hidden');
  $('doneBox').classList.remove('hidden'); $('doneBox').classList.add('flex');
  let ok = 0, ng = 0;
  for (const s of Object.values(sessionResults)) { ok += s.ok; ng += s.ng; }
  $('doneStats').textContent = `正解 ${ok} ／ 不正解 ${ng}` + (ok + ng ? `（正答率 ${Math.round(ok / (ok + ng) * 100)}%）` : '');
  const hasWrong = wrongCards.length > 0;
  $('reviewWrongBtn').classList.toggle('hidden', !hasWrong);
  if (hasWrong && cfg.retry && !inWrongReview) startWrongReview();
  updateProgress();
}

function startWrongReview() {
  if (wrongCards.length === 0) return;
  inWrongReview = true;
  cards = wrongCards.slice(); wrongCards = []; queueIdx = 0;
  undoStack = []; updateUndoBtn();
  saveState();
  $('doneBox').classList.add('hidden'); $('doneBox').classList.remove('flex');
  $('quizBox').classList.remove('hidden'); $('quizBox').classList.add('flex');
  toast('😤 不正解の即時復習スタート', 'bg-amber-500');
  renderCard();
}

// ── 修正モーダル ──
function openEdit() {
  const c = cards[queueIdx];
  if (!c) return;
  $('editId').textContent = c.id;
  $('editQ').value = c.question;
  $('editA').value = c.answer;
  $('editMsg').textContent = '';
  $('editModal').classList.remove('hidden');
}
function closeEdit() { $('editModal').classList.add('hidden'); }
// 修正の差分を抽出し、前後の文脈をアンカーとして付ける
// （改行1文字の修正でも、文脈ごと照合することで他の穴へ安全に反映できる）
function diffBlock(oldS, newS, ctx = 14) {
  let p = 0;
  while (p < oldS.length && p < newS.length && oldS[p] === newS[p]) p++;
  let s = 0;
  while (s < oldS.length - p && s < newS.length - p &&
         oldS[oldS.length - 1 - s] === newS[newS.length - 1 - s]) s++;
  if (oldS.length === newS.length && p === oldS.length) return null; // 変更なし
  const left = oldS.slice(Math.max(0, p - ctx), p);
  const right = oldS.slice(oldS.length - s, Math.min(oldS.length, oldS.length - s + ctx));
  return {
    oldBlock: left + oldS.slice(p, oldS.length - s) + right,
    newBlock: left + newS.slice(p, newS.length - s) + right,
  };
}

async function saveEdit() {
  const c = cards[queueIdx];
  if (!c) return;
  const q = $('editQ').value, a = $('editA').value.trim();
  $('editSaveBtn').disabled = true;
  $('editMsg').textContent = '保存中...';
  try {
    await notion('/v1/pages/' + c.pageId, {
      properties: {
        '問題文': { rich_text: [{ text: { content: q.slice(0, 2000) } }] },
        '正解': { rich_text: [{ text: { content: a.slice(0, 500) } }] },
      },
    }, 'PATCH');
    const oldQ = c.question;
    c.question = q; c.answer = a;
    saveState();
    closeEdit();
    renderCard();
    toast('✓ 保存。同じ題の他の穴へ反映中...', 'bg-emerald-600');
    propagateEdit(c, oldQ, q).then(n => {
      if (n > 0) toast(`✓ 他の${n}穴にも反映しました`, 'bg-emerald-600');
      else toast('✓ 修正を保存しました（他の穴に該当箇所なし）', 'bg-emerald-600');
    }).catch(e => toast('⚠ 一括反映エラー: ' + e.message, 'bg-rose-500'));
  } catch (e) {
    $('editMsg').textContent = '⚠ ' + e.message;
    $('editSaveBtn').disabled = false;
    return;
  }
  $('editSaveBtn').disabled = false;
}

// 同じ題のすべての穴に問題文の修正を反映する
async function propagateEdit(c, oldQ, newQ) {
  // 自分の穴マーカーを正規形（〔●n〕）に変換してから文脈つき差分を取る
  const mk = `〔●${c.holeNum}〕`;
  const d = diffBlock(oldQ.replaceAll('〔_〕', mk), newQ.replaceAll('〔_〕', mk));
  if (!d || d.oldBlock.length < 4) return 0;
  const { oldBlock, newBlock } = d;

  // 同じ題の全穴をNotionから取得
  let pages = [], cursor;
  do {
    const body = {
      page_size: 100,
      filter: { property: '題番号', rich_text: { equals: c.section } },
    };
    if (cursor) body.start_cursor = cursor;
    const j = await notion(`/v1/databases/${cfg.db}/query`, body);
    pages = pages.concat(j.results);
    cursor = j.has_more ? j.next_cursor : undefined;
  } while (cursor);

  let n = 0;
  for (const pg of pages) {
    if (pg.id === c.pageId) continue;
    const text = prop(pg.properties, '問題文', 'rich_text');
    const hn = prop(pg.properties, '穴番号', 'number');
    // その穴自身の位置は 〔_〕 になっているので差分側を変換
    const om = oldBlock.replaceAll(`〔●${hn}〕`, '〔_〕');
    const nm = newBlock.replaceAll(`〔●${hn}〕`, '〔_〕');
    if (!om || !text.includes(om)) continue;
    const fixed = text.replaceAll(om, nm);
    await notion('/v1/pages/' + pg.id, {
      properties: { '問題文': { rich_text: [{ text: { content: fixed.slice(0, 2000) } }] } },
    }, 'PATCH');
    n++;
    // 読み込み済みカードにも反映
    const lc = cards.find(x => x.pageId === pg.id);
    if (lc) lc.question = fixed;
  }
  if (n) saveState();
  return n;
}

// ── コンフェッティ ──
function confetti() {
  const colors = ['#f43f5e', '#6366f1', '#22c55e', '#eab308', '#a855f7', '#06b6d4'];
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[i % colors.length];
    el.style.animationDuration = (0.9 + Math.random() * 0.8) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
}

// ── 分析 ──
function tidSort(a, b) {
  const [a1, a2] = a.split('-').map(Number), [b1, b2] = b.split('-').map(Number);
  return a1 - b1 || a2 - b2;
}
function renderStats() {
  const box = $('view-stats');
  // 累計（history）+ 今日のカードのNotion統計
  const secs = Object.keys(history).sort(tidSort);
  let totalAns = 0, totalOk = 0;
  for (const s of secs) { totalAns += history[s].ok + history[s].ng; totalOk += history[s].ok; }

  // 弱点穴（今日読み込んだカードから: 2回以上出題かつ正答率60%未満 or 前回不正解）
  const weak = cards
    .filter(c => (c.total >= 2 && c.correct / c.total < 0.6) || wrongMap[c.id])
    .sort((a, b) => (a.total ? a.correct / a.total : 0) - (b.total ? b.correct / b.total : 0))
    .slice(0, 15);

  // 未学習・薄い題（historyにない/回答数が少ない選択範囲の題）
  const thin = secs.filter(s => history[s].ok + history[s].ng < 10);

  box.innerHTML = `
  <div class="grid grid-cols-3 gap-2">
    <div class="bg-gradient-to-br from-indigo-500 to-violet-600 text-white rounded-2xl p-3 text-center shadow">
      <div class="text-2xl font-extrabold">${totalAns}</div><div class="text-[11px] opacity-90">累計回答</div>
    </div>
    <div class="bg-gradient-to-br from-emerald-500 to-teal-600 text-white rounded-2xl p-3 text-center shadow">
      <div class="text-2xl font-extrabold">${totalAns ? Math.round(totalOk / totalAns * 100) : 0}%</div><div class="text-[11px] opacity-90">累計正答率</div>
    </div>
    <div class="bg-gradient-to-br from-rose-500 to-pink-600 text-white rounded-2xl p-3 text-center shadow">
      <div class="text-2xl font-extrabold">${Object.keys(wrongMap).length}</div><div class="text-[11px] opacity-90">要復習の穴</div>
    </div>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-2xl shadow p-4">
    <h2 class="font-bold mb-1">🎯 弱点（正答率が低い穴）</h2>
    <div class="text-[11px] text-slate-400 mb-2">本日の出題対象のうち、2回以上出題で正答率60%未満／前回不正解</div>
    ${weak.length === 0 ? '<div class="text-sm text-slate-400">弱点はありません 👏</div>' :
      weak.map(c => `
      <button class="w-full text-left py-1.5 border-b border-slate-100 dark:border-slate-800 last:border-0" onclick="jumpTo('${c.id}')">
        <div class="flex justify-between text-sm">
          <span class="font-medium">${c.section} #${c.holeNum} <span class="text-rose-500 font-bold">${esc(c.answer).slice(0, 16)}</span></span>
          <span class="text-xs ${c.total && c.correct / c.total < .4 ? 'text-rose-500' : 'text-amber-500'} font-bold">${c.total ? Math.round(c.correct / c.total * 100) + '%' : '前回✗'}</span>
        </div>
        <div class="text-[11px] text-slate-400">${esc(c.title)}（${c.correct}/${c.total}回）</div>
      </button>`).join('')}
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-2xl shadow p-4">
    <h2 class="font-bold mb-2">📚 題ごとの累計回答数・正答率</h2>
    ${secs.length === 0 ? '<div class="text-sm text-slate-400">まだ回答データがありません</div>' :
      secs.map(s => {
        const h = history[s], t = h.ok + h.ng, rate = t ? Math.round(h.ok / t * 100) : 0;
        const color = rate >= 80 ? 'bg-emerald-500' : rate >= 50 ? 'bg-amber-500' : 'bg-rose-500';
        return `<div class="mb-2">
        <div class="flex justify-between text-xs mb-0.5">
          <span class="font-medium">${s} ${esc(h.title || '')}</span>
          <span class="text-slate-400">${t}回・<b class="text-slate-600 dark:text-slate-300">${rate}%</b></span>
        </div>
        <div class="h-2.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
          <div class="h-full ${color} transition-all" style="width:${rate}%"></div>
        </div></div>`;
      }).join('')}
    ${thin.length ? `<div class="mt-3 text-[11px] text-amber-600 dark:text-amber-400">⚠ 回答10回未満の薄い題: ${thin.join('、')}</div>` : ''}
  </div>`;
}
function jumpTo(id) {
  const i = cards.findIndex((c, idx) => idx >= queueIdx && c.id === id);
  if (i >= 0) { queueIdx = i; saveState(); showTab('quiz'); renderCard(); }
  else toast('この穴は本日分では既に終了しています', 'bg-slate-600');
}

// ── 範囲選択 ──
const SECTION_TITLES = {"1-1":"個人の納税義務者と課税所得の範囲等","1-2":"法人の納税義務者と課税所得の範囲等","1-3":"納税地","2-1":"非課税所得","2-2":"保険金、損害賠償金等を取得した場合、支出した場合の取扱い","2-3":"年金についての課税関係","2-4":"各種所得の意義及び金額","2-5":"給与所得","2-6":"退職所得","2-7":"借地権等の設定に伴い取得した権利金の取扱い","2-8":"所得金額の計算の通則","2-9":"収入金額の評価の別段の定め","2-10":"資産の無償又は低額による移転があった場合","2-11":"収入及び費用の帰属時期の特例","2-12":"固定資産の交換の場合の譲渡所得の特例","2-13":"居住用財産を譲渡した場合の課税の特例","2-14":"利子所得、配当所得の課税関係","2-15":"有価証券の譲渡による所得の課税関係","2-16":"特定口座制度及び特定管理口座制度","2-17":"非課税口座制度","2-18":"特定の取締役等が受ける新株予約権の行使による株式の取得に係る経済的利益の非課税等","2-19":"特定中小会社が発行した株式に係る特例","2-20":"先物取引に係る所得の課税関係","2-21":"家事関連費等の取扱い","2-22":"資産について生じた損失の取扱い","2-23":"債権が回収不能となった場合の取扱い","2-24":"貸倒引当金","2-25":"事業を営む居住者と生計を一にする親族が支払を受ける対価","2-26":"資産に係る控除対象外消費税額等の必要経費算入","2-27":"取得費（有価証券の取得費を除く。）","2-28":"青色申告特別控除","3-1":"課税標準","3-2":"申告分離課税","3-3":"損益通算","3-4":"純損失の繰越控除","3-5":"雑損失の繰越控除","3-6":"居住用財産の買換え等の場合の譲渡損失の損益通算及び繰越控除","3-7":"特定居住用財産の譲渡損失の損益通算及び繰越控除","3-8":"所得金額調整控除","4-1":"所得控除（物的控除）","4-2":"所得控除（人的控除）","4-3":"医療費控除","5-1":"平均課税制度","5-2":"配当控除","5-3":"外国税額控除","5-4":"住宅借入金等を有する場合の所得税額の特別控除","5-5":"転任後の再居住年以後の特例","5-6":"認定住宅等に係る税額控除","6-1":"予定納税制度（予定納税額の減額承認申請を除く。）","6-2":"予定納税額の減額承認申請","6-3":"確定申告（死亡又は出国の場合を除く。）","6-4":"死亡又は出国の場合の確定申告","6-5":"確定申告による納付","6-6":"延納","6-7":"純損失の繰戻しによる還付","6-8":"青色申告制度","6-9":"青色申告者の特典","7-1":"源泉徴収","7-2":"利子所得、配当所得の源泉徴収","7-3":"給与所得の源泉徴収","7-4":"年末調整","7-5":"退職所得の源泉徴収","7-6":"公的年金等の源泉徴収","8-1":"帳簿書類の備付け等及び添付書類並びに総収入金額報告書の提出","8-2":"法定調書","9-1":"修正申告","9-2":"更正の請求","9-3":"更正又は決定","9-4":"不服申立て","10-1":"国外転出（出国）時課税制度","10-2":"国外転出（贈与等）時課税制度"};
const ALL_SECTIONS = Object.keys(SECTION_TITLES);
function renderRange() {
  const sel = selectedSections() || ALL_SECTIONS;
  $('rangeList').innerHTML = ALL_SECTIONS.map(s =>
    `<label class="flex items-start gap-2 py-1.5 border-b border-slate-100 dark:border-slate-800 last:border-0">
      <input type="checkbox" class="rangecb w-4 h-4 mt-0.5 shrink-0 accent-indigo-600" value="${s}" ${sel.includes(s) ? 'checked' : ''}>
      <span class="leading-snug"><b class="text-indigo-600 dark:text-indigo-400">${s}</b>
        <span class="text-[12px] text-slate-600 dark:text-slate-300">${esc(SECTION_TITLES[s] || '')}</span></span>
    </label>`).join('');
  renderPresets();
}
function rangeAll(on) { document.querySelectorAll('.rangecb').forEach(cb => cb.checked = on); }
function applyRange() {
  const sel = [...document.querySelectorAll('.rangecb:checked')].map(cb => cb.value);
  localStorage.setItem('rangeSel', JSON.stringify(sel.length === ALL_SECTIONS.length ? null : sel));
  localStorage.removeItem('quizState');
  showTab('quiz');
  loadCards(true);
}
function savePreset() {
  const name = prompt('プリセット名');
  if (!name) return;
  const sel = [...document.querySelectorAll('.rangecb:checked')].map(cb => cb.value);
  const ps = JSON.parse(localStorage.getItem('presets') || '{}');
  ps[name] = sel;
  localStorage.setItem('presets', JSON.stringify(ps));
  renderPresets();
}
function renderPresets() {
  const ps = JSON.parse(localStorage.getItem('presets') || '{}');
  $('presetList').innerHTML = Object.keys(ps).map(n =>
    `<button onclick="loadPreset('${esc(n)}')" class="px-3 py-1.5 text-xs bg-violet-100 dark:bg-violet-900 text-violet-700 dark:text-violet-300 rounded-lg pressable">${esc(n)}</button>`).join('');
}
function loadPreset(name) {
  const sel = (JSON.parse(localStorage.getItem('presets') || '{}'))[name] || [];
  document.querySelectorAll('.rangecb').forEach(cb => cb.checked = sel.includes(cb.value));
}

// ── 起動 ──
showTab('quiz');
if (cfg.token) loadCards(false);
else {
  $('loadingMsg').textContent = '⚙設定タブでNotionトークンを入力してください';
  $('loadBtn').classList.remove('hidden');
}
</script>
